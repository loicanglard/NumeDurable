[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numedurable"
version = "0.1.0"
description = "T.R.A.I.L Flask application"
requires-python = ">=3.10"
dependencies = [
  "flask==3.1.0",
  "flask-login==0.6.3",
  "flask-wtf==1.2.2",
  "bcrypt==4.2.1",
  "python-dotenv>=1.0.0",
  "psycopg2-binary==2.9.9",
  "flask-limiter==2.8.0",
  "gunicorn==21.2.0",
  "supabase>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]
exclude = ["database", "frontend"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["backend"]
omit = ["backend/routes/sorties.py", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false